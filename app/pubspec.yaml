name: angebotsbot
description: Begleit-App zum AngebotsBot (PC) – Einkaufsliste (auch ohne PC), Treffer, Watchlist und Prospekte.
publish_to: none
version: 1.10.2+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  # QR-Code vom PC scannen (Einrichtung)
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
