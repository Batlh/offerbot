name: Windows-Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: EXE bauen
        run: pyinstaller --noconfirm --windowed --name AngebotsBot --collect-all rapidocr_onnxruntime --collect-all playwright --collect-data pymupdf main.py

      - name: Paket schnueren
        shell: pwsh
        run: |
          Copy-Item README.md dist/AngebotsBot/
          Compress-Archive -Path dist/AngebotsBot -DestinationPath AngebotsBot-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AngebotsBot-windows
          path: AngebotsBot-windows.zip
          retention-days: 30

      - name: Release anlegen (nur bei Versions-Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AngebotsBot-windows.zip
          generate_release_notes: true
