name: Windows-Build

# Jeder Push auf main: testen, EXE bauen und als neue Release veröffentlichen
# (Changelog-Abschnitt der Version + Liste der Commits seit der letzten Release).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]   # reine Doku-Änderungen erzeugen keinen Build/keine Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - name: Gradle-Spiegel (wie casino-app)
        run: |
          mkdir -p ~/.gradle/init.d
          cp ci/maven-mirror.gradle ci/compile-sdk.gradle ~/.gradle/init.d/
      - name: Signierschlüssel bereitstellen
        if: github.event_name != 'pull_request'
        env:
          STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          # Ohne Secrets nicht mit dem Debug-Schlüssel weiterbauen – solche APKs ließen sich nicht als Update installieren
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PW" ]; then
            echo "::error::Secrets SIGNING_STORE_B64 und SIGNING_STORE_PASSWORD fehlen (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/offerbot-release.jks"
          {
            echo "OB_KEYSTORE=$RUNNER_TEMP/offerbot-release.jks"
            echo "OB_KEYSTORE_PW=$STORE_PW"
            echo "OB_KEY_ALIAS=offerbot"
          } >> "$GITHUB_ENV"
      - name: APK bauen
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('../angebotsbot/__init__.py', encoding='utf-8').read()).group(1))")
          for try in 1 2 3; do
            flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }} && break
            [ "$try" = 3 ] && exit 1
            echo "Neuer Versuch in 30 Sekunden"; sleep 30
          done
          mv build/app/outputs/flutter-apk/app-release.apk ../AngebotsBot.apk
      - name: Signatur prüfen
        if: github.event_name != 'pull_request'
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs ../AngebotsBot.apk | tee signatur.txt
          # Fingerabdruck des Release-Schlüssels io.github.batlh.offerbot (seit 1.10.8)
          grep -qi "5f9c6fbb90ea43027e45d3da7eecaa62bfed468e743f18faaba61519d94394e9" signatur.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: AngebotsBot.apk
          if-no-files-found: error
          retention-days: 30

  build:
    needs: android
    if: ${{ !cancelled() }}   # Windows-Version kommt auch, wenn die APK einmal scheitert
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # für Tags und die Liste der Änderungen

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: EXE bauen
        run: pyinstaller --noconfirm --windowed --name AngebotsBot --collect-all rapidocr_onnxruntime --collect-all playwright --collect-data pymupdf --add-data "README.md:." --add-data "angebotsbot/core/install_update.ps1:angebotsbot/core" main.py

      - name: Paket schnueren
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md dist/AngebotsBot/
          Compress-Archive -Path dist/AngebotsBot -DestinationPath AngebotsBot-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AngebotsBot-windows
          path: AngebotsBot-windows.zip
          retention-days: 30

      - name: APK aus dem Android-Build holen
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-apk
          path: .

      - name: Release-Text vorbereiten
        if: github.event_name != 'pull_request'
        id: rel
        shell: bash
        env:
          PYTHONUTF8: "1"           # Umlaute im Release-Text (Windows-Konsole ist sonst cp1252)
          PYTHONIOENCODING: utf-8
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('angebotsbot/__init__.py', encoding='utf-8').read()).group(1))")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAG="v$VERSION-build.${{ github.run_number }}"   # gleiche Version neu gebaut
          else
            TAG="v$VERSION"
          fi
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            python - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(f"## Version {v}\n")
          print(m.group(1).strip() if m else "_Kein Changelog-Eintrag für diese Version._")
          PY
            echo
            echo "### Alle Änderungen seit ${PREV:-dem Anfang}"
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            git log $RANGE --no-merges --format='- %s (%h)'
            echo
            echo "---"
            echo "**Download:** \`AngebotsBot-windows.zip\` unten bei *Assets* – entpacken, \`AngebotsBot.exe\` starten."
            echo "**Handy:** \`AngebotsBot.apk\` aufs Android-Handy laden und installieren, dann am PC unter Einstellungen → Handy-App den QR-Code scannen."
            echo "Update: über die alte Version entpacken, den Ordner \`data\` behalten."
            echo "Windows-SmartScreen warnt beim ersten Start (nicht signiert): „Weitere Informationen“ → „Trotzdem ausführen“."
          } > release_notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=AngebotsBot $VERSION (Build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          cat release_notes.md

      - name: Release veroeffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body_path: release_notes.md
          files: |
            AngebotsBot-windows.zip
            AngebotsBot.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
